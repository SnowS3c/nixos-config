# ═══════════════════════════════════════════════════════════
# HYPRIDLE CONFIGURATION — Labwc / NixOS
# Respects Wayland & D-Bus idle inhibition (Steam, games, calls)
# ═══════════════════════════════════════════════════════════

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# Lock screen after 5 minutes (300 seconds) of inactivity
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Suspend system after 20 minutes (1200 seconds) of inactivity
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
