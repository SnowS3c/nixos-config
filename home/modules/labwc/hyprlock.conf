# ═══════════════════════════════════════════════════════════
# HYPRLOCK CONFIGURATION — NixOS Theme (nixos-wallpaper.png)
# ═══════════════════════════════════════════════════════════

background {
    monitor =
    path = ~/.config/labwc/nixos-wallpaper.png
    color = rgba(18, 27, 32, 0.5)

    # Disable software blur passes to avoid CPU overhead in virtual machines
    blur_passes = 0
}

# ── Permanent Clock Label (Always visible) ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgb(111, 227, 225)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 0
}

# ── Permanent Date Label (Always visible) ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgb(216, 238, 237)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 0
}

# ── Password Input Field ──
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(255, 77, 77)
    inner_color = rgba(26, 38, 44, 0.8)
    font_color = rgb(216, 238, 237)
    fade_on_empty = false
    placeholder_text = <span foreground="##718e99"><i>Password...</i></span>
    hide_input = false

    check_color = rgb(111, 227, 225)
    fail_color = rgb(255, 59, 59)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -40
    halign = center
    valign = center
}
